[project]
name = "private-youtube-mp3-bot"
version = "1.0.0"
description = "Private Telegram bot: YouTube to MP3"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4,<4",
  "aiohttp>=3.12,<4",
  "python-dotenv>=1.1,<2",
  "yt-dlp[default]>=2026.8.19",
  "mutagen>=1.47,<2",
  "deno>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "pip-audit>=2.9", "pytest-cov>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
