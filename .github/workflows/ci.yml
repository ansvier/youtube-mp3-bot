name: Verification
# Manual only: publishing code must not start potentially billable runners.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: docker build --target bot -t mp3-bot:test .
      - run: docker build --target worker -t mp3-worker:test .
      - run: docker build --target test -t mp3-tests:test .
      - run: >-
          docker run --rm --init --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --memory=2g --memory-swap=2g --pids-limit=128
          --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777 mp3-tests:test
