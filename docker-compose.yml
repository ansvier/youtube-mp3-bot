name: private-youtube-mp3

x-security: &security
  init: true
  restart: unless-stopped
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot:
    <<: *security
    build:
      context: .
      target: bot
    image: private-youtube-mp3-bot:local
    environment:
      # Explicit list: do NOT use env_file, which would leak cookies to bot.
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:?Set ALLOWED_USER_IDS in .env}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-1}
      QUEUE_SIZE: ${QUEUE_SIZE:-5}
      RATE_LIMIT_SECONDS: ${RATE_LIMIT_SECONDS:-30}
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-600}
      CONVERSION_TIMEOUT: ${CONVERSION_TIMEOUT:-300}
      UPLOAD_TIMEOUT: ${UPLOAD_TIMEOUT:-300}
      DEFAULT_AUDIO_BITRATE: ${DEFAULT_AUDIO_BITRATE:-192}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TEMP_DIR: ${TEMP_DIR:-/tmp/mp3-bot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MEDIA_WORKER_URL: http://worker:8080
    depends_on:
      worker:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -m, mp3_bot, --healthcheck]
      interval: 20s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker:
    <<: *security
    build:
      context: .
      target: worker
    image: private-youtube-mp3-worker:local
    environment:
      # This container MUST NOT receive BOT_TOKEN or user identifiers.
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-1}
      DOWNLOAD_TIMEOUT: ${DOWNLOAD_TIMEOUT:-600}
      CONVERSION_TIMEOUT: ${CONVERSION_TIMEOUT:-300}
      DEFAULT_AUDIO_BITRATE: ${DEFAULT_AUDIO_BITRATE:-192}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-}
      MAX_SOURCE_SIZE_MB: ${MAX_SOURCE_SIZE_MB:-512}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TEMP_DIR: /tmp/mp3-worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COOKIES_FILE: ${COOKIES_FILE:-}
    # No published ports. Only the bot on the project network uses the worker.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1536m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD, python, -m, media_worker, --healthcheck]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
